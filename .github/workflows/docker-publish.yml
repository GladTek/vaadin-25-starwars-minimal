name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Version Config
        id: config
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push (e.g. v1.2.0): derive everything from the tag itself,
            # so a release is never dependent on version.json being up to date.
            echo "TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "UPDATE_LATEST=true" >> $GITHUB_OUTPUT
            echo "SHOULD_PUSH=true" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=$(jq -r .image_name version.json)" >> $GITHUB_OUTPUT
          else
            echo "TAG=$(jq -r .tag version.json)" >> $GITHUB_OUTPUT
            echo "UPDATE_LATEST=$(jq -r .update_latest version.json)" >> $GITHUB_OUTPUT
            echo "SHOULD_PUSH=$(jq -r .push version.json)" >> $GITHUB_OUTPUT
            echo "IMAGE_NAME=$(jq -r .image_name version.json)" >> $GITHUB_OUTPUT
          fi

          if [ -n "$DOCKER_USERNAME" ]; then
            echo "HAS_DOCKER_HUB=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_DOCKER_HUB=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: steps.config.outputs.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.config.outputs.SHOULD_PUSH == 'true' && steps.config.outputs.HAS_DOCKER_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker Tags
        id: tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          TAG="${{ steps.config.outputs.TAG }}"
          IMAGE_NAME="${{ steps.config.outputs.IMAGE_NAME }}"
          UPDATE_LATEST="${{ steps.config.outputs.UPDATE_LATEST }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          GHCR_IMAGE="ghcr.io/$OWNER/$IMAGE_NAME"
          TAGS="$GHCR_IMAGE:$TAG"
          if [ "$UPDATE_LATEST" = "true" ]; then
            TAGS="$TAGS,$GHCR_IMAGE:latest"
          fi

          if [ -n "$DOCKER_USERNAME" ]; then
            DH_IMAGE="$DOCKER_USERNAME/$IMAGE_NAME"
            TAGS="$TAGS,$DH_IMAGE:$TAG"
            if [ "$UPDATE_LATEST" = "true" ]; then
              TAGS="$TAGS,$DH_IMAGE:latest"
            fi
          fi

          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.config.outputs.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.DOCKER_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
